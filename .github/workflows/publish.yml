name: Build and publish the presentation
on:
  push:
    branches: [main]
    paths:
      - 'content/plan.md'
      - 'content/sources.json'
      - 'scripts/build.py'
      - 'scripts/prepare.py'
      - 'scripts/finalise.py'
      - 'scripts/check_browser.py'
      - 'assets/**'
      - 'LICENCE.md'
      - 'RIGHTS.md'
      - '.github/workflows/publish.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: missing-middle-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install publication tools
        run: |
          python -m pip install 'python-docx>=1.1,<2' 'PyMuPDF>=1.24,<2' 'Pillow>=10,<13' playwright
          sudo apt-get update -qq
          sudo apt-get install -y libreoffice-writer fonts-liberation fonts-dejavu-core
          python -m playwright install --with-deps chromium
      - name: Build one manuscript into all editions
        run: |
          python scripts/prepare.py
          python scripts/build.py --pdf --check
          python scripts/finalise.py
      - name: Check mobile, desktop and interactions
        run: python scripts/check_browser.py
      - name: Preserve generated publication
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html' assets content documents downloads briefs AGENTS.md README.md robots.txt sitemap.xml llms.txt .nojekyll
          if ! git diff --cached --quiet; then
            git commit -m 'Build checked presentation, source readers and matching PDF and Word plan'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Assemble static publication
        run: |
          mkdir -p _site
          cp ./*.html .nojekyll robots.txt sitemap.xml llms.txt LICENCE.md RIGHTS.md AGENTS.md _site/
          cp -r assets content documents downloads briefs _site/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: missing-middle-publication-and-checks
          path: |
            _site
            downloads
            checks
            scripts
            content
            assets
            briefs
            LICENCE.md
            RIGHTS.md
            AGENTS.md
            README.md
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
